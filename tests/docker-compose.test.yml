services:
  postgres-test:
    build:
      context: .
      dockerfile: Dockerfile.testdb
    image: zwfm-aerontoolbox-testdb:postgres17
    container_name: aeron-test-db
    environment:
      POSTGRES_USER: aeron
      POSTGRES_PASSWORD: aeron123
      POSTGRES_DB: aeron_db
    ports:
      - "5433:5432"  # Different port to avoid conflicts with local dev
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aeron", "-d", "aeron_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-test:
    image: minio/minio:latest
    container_name: aeron-test-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"  # Console
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
