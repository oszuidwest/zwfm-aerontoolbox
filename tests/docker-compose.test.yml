services:
  postgres-test:
    image: postgres:17-alpine
    container_name: aeron-test-db
    environment:
      POSTGRES_USER: aeron
      POSTGRES_PASSWORD: aeron123
      POSTGRES_DB: aeron_db
    ports:
      - "5433:5432"  # Different port to avoid conflicts with local dev
    volumes:
      - ./fixtures/mock_data.sql:/docker-entrypoint-initdb.d/01-mock-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeron -d aeron_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs-test:
    image: chrislusf/seaweedfs:latest
    container_name: aeron-test-s3
    profiles: ["s3"]  # Only started with --profile s3 (used by the s3 test suite)
    ports:
      - "8333:8333"  # S3 API
    volumes:
      - ./fixtures/s3_config.json:/etc/seaweedfs/s3_config.json:ro
    command: server -ip.bind=0.0.0.0 -s3 -s3.config=/etc/seaweedfs/s3_config.json -dir=/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
