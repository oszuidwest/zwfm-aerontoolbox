version: "2"

linters:
  enable:
    # Existing
    - gocritic
    - gocyclo
    # Doc/Comment
    - godot
    - godoclint
    - dupword
    - misspell
    # Code quality
    - errorlint
    - gosec
    - nilerr
    - unparam
    - unconvert
    - bodyclose
    - modernize
    # Upload context must reach the image download
    - contextcheck
  exclusions:
    rules:
      - path-except: internal/service/media\.go
        linters:
          - contextcheck
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 20
    godot:
      scope: toplevel
